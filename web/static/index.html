<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent-Box</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<header>
  <h1>Agent-Box <span class="host">titan</span></h1>
  <div class="head-actions">
    <span id="updated" class="muted"></span>
    <button id="logout" class="ghost" hidden>Abmelden</button>
  </div>
</header>

<main>
  <form id="login" class="card login" hidden>
    <h2>Anmelden</h2>
    <label>Passwort <input type="password" id="password" autocomplete="current-password" required></label>
    <button type="submit">Anmelden</button>
    <p id="login-error" class="error"></p>
  </form>

  <div id="contexts" class="grid"></div>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<template id="ctx-card">
  <section class="card ctx">
    <div class="ctx-head">
      <h2 class="ctx-name"></h2>
      <span class="badge state"></span>
    </div>
    <dl class="facts">
      <div><dt>RAM</dt><dd class="ram"></dd></div>
      <div><dt>Agenten</dt><dd class="agents"></dd></div>
      <div><dt>Systemplatte</dt><dd class="disk"></dd></div>
      <div><dt>Orca-GUI</dt><dd class="gui"></dd></div>
    </dl>
    <div class="row actions">
      <button data-act="start">Starten</button>
      <button data-act="pause">Pausieren</button>
      <button data-act="restart">Neustart</button>
      <button data-act="focus" title="Die andere VM pausieren">Fokus</button>
      <button data-act="reset" class="danger" title="Systemplatte frisch, Daten bleiben">Reset</button>
    </div>

    <div class="alerts-box" hidden>
      <h3 class="alert-title">Verdächtige Zugriffe (24 h)</h3>
      <ul class="list alerts"></ul>
      <p class="muted small">Zugriffsversuche auf Dienste, die bei Supply-Chain-Angriffen zum Abfluss von Daten oder zur Steuerung genutzt wurden, oder auf Domains, die so aussehen. Fehlalarme sind möglich. Wenn du dir den Zugriff nicht erklären kannst: VM zurücksetzen und Tokens erneuern.</p>
    </div>

    <h3>Web</h3>
    <div class="row web">
      <span class="web-mode"></span>
      <select class="open-minutes" aria-label="Dauer">
        <option value="15">15 Min.</option>
        <option value="30" selected>30 Min.</option>
        <option value="60">1 Std.</option>
        <option value="120">2 Std.</option>
      </select>
      <button data-act="open-web">Offen auf Zeit</button>
      <button data-act="close-web" class="ghost">Schließen</button>
    </div>

    <details class="blocked-box" open>
      <summary>Blockiert (24 h) <span class="count muted"></span></summary>
      <ul class="list blocked"></ul>
    </details>

    <details>
      <summary>Eigene Freigaben <span class="count-allow muted"></span></summary>
      <ul class="list allowlist"></ul>
      <form class="row add-domain">
        <input type="text" placeholder="domain.de" aria-label="Domain freigeben" required>
        <button type="submit">Freigeben</button>
      </form>
    </details>

    <details>
      <summary>Zugänge</summary>
      <p class="token-state"></p>
      <form class="row token-form">
        <input type="password" placeholder="sk-ant-… aus 'claude setup-token'" aria-label="Claude-Token" required>
        <button type="submit">Token speichern</button>
      </form>
      <p class="muted small">Wird bei Anthropic geprüft. Danach „Neustart“, damit die VM es übernimmt.</p>
      <p>GitHub-App gilt für: <span class="owners"></span></p>
      <form class="row owners-form">
        <input type="text" placeholder="likt0r, acme-corp, other-org" aria-label="GitHub-Owner">
        <button type="submit">Setzen</button>
      </form>
    </details>

    <details>
      <summary>Orca koppeln</summary>
      <p class="muted small">Der Code gibt vollen Zugriff auf diese VM. Nur auf eigenen Geräten verwenden.</p>
      <button data-act="pair" class="ghost">Pairing-Code anzeigen</button>
      <div class="pair-out" hidden>
        <textarea readonly rows="4"></textarea>
        <button class="copy ghost">Kopieren</button>
      </div>
    </details>
  </section>
</template>
</body>
</html>
