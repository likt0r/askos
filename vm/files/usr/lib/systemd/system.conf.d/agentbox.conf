# For every service of the VM, so also for orca serve and everything the agents
# start in it. host.agentbox is the Host (agentbox-guest-setup adds it).
# The package minimum age is in agentbox-packages.conf (package-safeguards).
[Manager]
DefaultEnvironment="PATH=/usr/lib/agentbox/bin:/usr/local/bin:/usr/bin:/usr/sbin" \
  "HTTPS_PROXY=http://host.agentbox:3128" "HTTP_PROXY=http://host.agentbox:3128" \
  "https_proxy=http://host.agentbox:3128" "http_proxy=http://host.agentbox:3128" \
  "NO_PROXY=localhost,127.0.0.1,.localhost,host.agentbox" \
  "no_proxy=localhost,127.0.0.1,.localhost,host.agentbox" \
  "AGENTBOX_GH_ADDR=host.agentbox:9100" "NODE_USE_ENV_PROXY=1" \
  "DO_NOT_TRACK=1" "ORCA_TELEMETRY_DISABLED=1" "DISABLE_AUTOUPDATER=1" \
  "RUSTUP_HOME=/usr/lib/rustup" "JAVA_HOME=/usr/lib/jvm/temurin-21" \
  "JAVA_TOOL_OPTIONS=-Dhttps.proxyHost=host.agentbox -Dhttps.proxyPort=3128 -Dhttp.proxyHost=host.agentbox -Dhttp.proxyPort=3128 -Dhttp.nonProxyHosts=localhost|127.0.0.1|host.agentbox"
