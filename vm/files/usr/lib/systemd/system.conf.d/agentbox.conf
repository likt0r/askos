# For every service of the VM, so also for orca serve and everything the agents
# start in it, and the one place of the image-wide variables: the Build writes them into
# /etc/environment for logins too (vm/build/login-environment, #164).
# host.agentbox is the Host (agentbox-guest-setup adds it).
# The package minimum age is in agentbox-packages.conf (package-safeguards).
# ENABLE_CLAUDEAI_MCP_SERVERS=false: Claude Code fetches none of the owner's claude.ai
# connectors (Gmail, Drive, ...), even after a /login in the VM; the Claude token itself
# cannot fetch them.
# DOCKER_HOST: docker and docker compose use the agent's rootless Podman (podman.socket,
# uid 1000).
# PLAYWRIGHT_*: Playwright takes the browsers of the Image (read-only, vm/Containerfile) and
# downloads none, also not when a project's npm install brings Playwright.
[Manager]
DefaultEnvironment="PATH=/usr/lib/agentbox/bin:/usr/local/bin:/usr/bin:/usr/sbin" \
  "AGENTBOX_GH_ADDR=host.agentbox:9100" \
  "DO_NOT_TRACK=1" "ORCA_TELEMETRY_DISABLED=1" "DISABLE_AUTOUPDATER=1" \
  "ENABLE_CLAUDEAI_MCP_SERVERS=false" \
  "DOCKER_HOST=unix:///run/user/1000/podman/podman.sock" \
  "RUSTUP_HOME=/usr/lib/rustup" "JAVA_HOME=/usr/lib/jvm/temurin-21" \
  "PLAYWRIGHT_BROWSERS_PATH=/usr/lib/ms-playwright" "PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1"
