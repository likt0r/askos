# Agent Box (#127): SSH only by key and only as agent. A Safeguard: every Build is checked
# for these values (agentbox/safeguards.py). sshd takes the first value it reads, and this
# file sorts before Fedora's 50-redhat.conf. sshd starts in no VM by itself (the preset
# 10-agentbox.preset); the keys and the host key come from the Host into /run/agentbox/ssh.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
HostbasedAuthentication no
PermitRootLogin no
AllowUsers agent
AuthorizedKeysFile /run/agentbox/ssh/authorized_keys
AuthorizedKeysCommand none
TrustedUserCAKeys none
HostKey /run/agentbox/ssh/host_key
AllowTcpForwarding local
AllowAgentForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
UsePAM yes
