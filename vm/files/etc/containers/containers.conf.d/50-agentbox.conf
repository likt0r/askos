# Containers in the VM (podman, docker through podman-docker, podman compose and docker
# compose through Docker Compose) reach the outside the way everything else here does:
# through the Host's proxy, with no DNS of their own. The VM forwards nothing, so a container
# that ignores the proxy reaches nothing; these settings only tell containers where the proxy
# is (#27, #34).
[containers]
# podman run passes the proxy from the caller's environment into the container (Podman's
# default; the agent's shells and services have it from systemd). Docker Compose gives builds
# and containers the proxy from ~/.docker/config.json (guest-setup).

# The VM's /etc/hosts, which names host.agentbox (agentbox-guest-setup adds it), so every
# container and every build resolves it, also those created through the Docker API.
base_hosts_file = "/etc/hosts"

[engine]
# podman compose (and docker compose, which is podman compose) runs Docker Compose, which
# builds and starts containers through the agent's Podman socket.
compose_providers = ["/usr/libexec/docker/cli-plugins/docker-compose"]
compose_warning_logs = false
# Podman itself (pulls, and the proxy podman build passes into RUN), whatever started it.
# A variable the caller already has keeps its value.
env = [
  "HTTPS_PROXY=http://host.agentbox:3128", "HTTP_PROXY=http://host.agentbox:3128",
  "https_proxy=http://host.agentbox:3128", "http_proxy=http://host.agentbox:3128",
  "NO_PROXY=localhost,127.0.0.1,.localhost,host.agentbox",
  "no_proxy=localhost,127.0.0.1,.localhost,host.agentbox",
  {append=true},
]
