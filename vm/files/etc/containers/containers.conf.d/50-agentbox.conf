# Containers in the VM (podman, and docker/docker compose through the agent's Podman
# socket) reach the outside the way everything else here does: through the Host's proxy,
# with no DNS of their own. The VM forwards nothing, so a container that ignores the proxy
# reaches nothing; these settings only tell containers where the proxy is (#27).
[containers]
# Every container gets the proxy, whether started by the CLI or through the Docker API
# (which ignores http_proxy below), whatever the caller's environment. NO_PROXY stays
# local-only, as for the services of the VM.
env = [
  "HTTPS_PROXY=http://host.agentbox:3128", "HTTP_PROXY=http://host.agentbox:3128",
  "https_proxy=http://host.agentbox:3128", "http_proxy=http://host.agentbox:3128",
  "NO_PROXY=localhost,127.0.0.1,.localhost,host.agentbox",
  "no_proxy=localhost,127.0.0.1,.localhost,host.agentbox",
  {append=true},
]
http_proxy = true
# The VM's /etc/hosts, which names host.agentbox (agentbox-guest-setup adds it). Without this,
# containers created through the Docker API start from the image's hosts file.
base_hosts_file = "/etc/hosts"

[engine]
# Podman itself (pulls, and the proxy podman build passes into RUN) whatever started it.
# Builds through the Docker API take the proxy from the client instead: ~/.docker/config.json,
# put into the agent's home by agentbox-guest-setup.
env = [
  "HTTPS_PROXY=http://host.agentbox:3128", "HTTP_PROXY=http://host.agentbox:3128",
  "https_proxy=http://host.agentbox:3128", "http_proxy=http://host.agentbox:3128",
  "NO_PROXY=localhost,127.0.0.1,.localhost,host.agentbox",
  "no_proxy=localhost,127.0.0.1,.localhost,host.agentbox",
  {append=true},
]
