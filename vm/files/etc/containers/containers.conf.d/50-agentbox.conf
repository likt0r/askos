# Containers in the VM (podman, docker through podman-docker, podman compose and docker
# compose through Docker Compose) reach the outside the way everything else here does:
# through the Host's proxy, with no DNS of their own. The VM forwards nothing, so a container
# without the proxy reaches nothing; these settings only tell builds where the proxy is
# (#27, #34).
# The owner's decision: builds get the proxy, running containers do not, because compose
# services call each other by name over HTTP, and many programs (Bun, Go, curl, Python) send
# those calls to the proxy when proxy variables are set.
[containers]
# No proxy from the caller's environment into running containers (the agent's shells and
# services have it from systemd). A service that needs the internet gets it by hand
# (environment: in its compose file). podman build passes the proxy into RUN regardless.
http_proxy = false
# The VM's /etc/hosts, which names host.agentbox (agentbox-guest-setup adds it), so a container
# given the proxy by hand, and every build, resolves it.
base_hosts_file = "/etc/hosts"

[engine]
# podman compose (and docker compose, which is podman compose) runs Docker Compose, which
# builds and starts containers through the agent's Podman socket. Podman passes no proxy into
# builds through that socket: a compose file gives its builds the proxy as build args.
compose_providers = ["/usr/libexec/docker/cli-plugins/docker-compose"]
compose_warning_logs = false
# Podman itself (pulls, and the proxy podman build passes into RUN), whatever started it.
# A variable the caller already has keeps its value.
env = [
  "HTTPS_PROXY=http://host.agentbox:3128", "HTTP_PROXY=http://host.agentbox:3128",
  "https_proxy=http://host.agentbox:3128", "http_proxy=http://host.agentbox:3128",
  "NO_PROXY=localhost,127.0.0.1,.localhost,host.agentbox",
  "no_proxy=localhost,127.0.0.1,.localhost,host.agentbox",
  {append=true},
]
