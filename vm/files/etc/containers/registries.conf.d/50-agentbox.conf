# Short image names (traefik:v3.5.4, postgres:16-alpine in a compose file) resolve to docker.io,
# as they do with Docker (#32). Fedora's registries.conf searches registry.fedoraproject.org
# and registry.access.redhat.com first, which the Host's proxy blocks, so the pull failed.
# Drop-ins load after /etc/containers/registries.conf in alpha-numerical order and overwrite
# the fields they set; this one sorts after Fedora's 000-shortnames.conf, whose aliases stay
# and still win over the search. With one search registry short-name-mode "enforcing" has no
# choice to prompt for, with or without a TTY.
unqualified-search-registries = ["docker.io"]
